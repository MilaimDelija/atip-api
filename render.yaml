services:
  - type: web
    name: atip-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: BLOCKCHAIN_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAILS
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_MIN_LEVEL
        value: HIGH
    healthCheckPath: /health
