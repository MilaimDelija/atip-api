services:
  - type: web
    name: atip-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
    healthCheckPath: /health
